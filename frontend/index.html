<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Agent World</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      :root {
        color-scheme: light;
        font-family: Menlo, Monaco, Consolas, 'Liberation Mono', monospace;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: radial-gradient(circle at 20% 10%, #325f31, #0f1a0f 60%);
        color: #f2f7ff;
        overflow: hidden;
      }

      #app-shell {
        position: relative;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
      }

      #connection-status {
        position: absolute;
        top: 12px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 2;
        border-radius: 999px;
        padding: 6px 12px;
        border: 1px solid #c7d2fe;
        font-size: 12px;
        letter-spacing: 0.2px;
        background: rgba(15, 23, 42, 0.8);
        pointer-events: none;
      }

      #connection-status[data-state='live'] {
        border-color: #7dd3fc;
        color: #bae6fd;
      }

      #connection-status[data-state='reconnecting'] {
        border-color: #fcd34d;
        color: #fef3c7;
      }

      #connection-status[data-state='error'] {
        border-color: #fca5a5;
        color: #fee2e2;
      }

      #root {
        width: 100%;
        height: 100%;
      }

      #assets-link {
        position: absolute;
        top: 12px;
        right: 12px;
        z-index: 2;
        padding: 6px 10px;
        border-radius: 6px;
        background: rgba(15, 23, 42, 0.8);
        border: 1px solid #7dd3fc;
        color: #bae6fd;
        font-size: 12px;
        text-decoration: none;
      }
      #assets-link:hover { background: rgba(30, 58, 74, 0.9); }

      #company-selector select {
        background-image: none;
      }
      #company-selector:hover {
        background: rgba(30, 58, 74, 0.9) !important;
      }

      /* Intermediate viewports (< 1024px): the top-right button cluster
         — Help (?), Day/Night, Editor, Assets → — packs tightly.
         Force compact padding + hide the "Assets →" link so the cluster
         stays within the viewport without overlapping the agent roster. */
      @media (max-width: 1024px) {
        #assets-link { display: none; }
        #world-editor-toggle {
          font-size: 11px !important;
          padding: 4px 8px !important;
          right: 96px !important;
        }
        #sky-mode-toggle {
          font-size: 11px !important;
          padding: 4px 8px !important;
          right: 170px !important;
        }
        #help-button {
          right: 232px !important;
          width: 28px !important; height: 28px !important;
        }
      }

      /* Mobile adjustments — compact buttons + hide non-essential UI */
      @media (max-width: 600px) {
        #connection-status {
          font-size: 10px;
          padding: 4px 8px;
          top: 8px;
        }
        #assets-link { display: none !important; }
        #world-editor-toggle {
          font-size: 10px !important;
          padding: 4px 8px !important;
          top: 8px !important;
          right: 80px !important;
        }
        #sky-mode-toggle {
          font-size: 10px !important;
          padding: 4px 8px !important;
          top: 8px !important;
          right: 150px !important;
        }
        #help-button {
          top: 8px !important;
          right: 220px !important;
          width: 26px !important; height: 26px !important;
        }
        #agent-roster {
          display: none !important;
        }
        #event-log {
          width: calc(100vw - 24px) !important;
          max-width: calc(100vw - 24px) !important;
        }
        #session-detail-panel {
          right: 12px !important;
          width: calc(100vw - 24px) !important;
        }
        #company-selector {
          font-size: 10px !important;
          top: 8px !important;
          left: 8px !important;
        }
        #company-selector select {
          font-size: 10px !important;
          padding: 4px 8px !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="app-shell">
      <div id="connection-status" data-state="connecting">Connecting...</div>
      <a id="assets-link" href="/assets-manager">Assets →</a>
      <div id="root"></div>
    </div>
    <script src="main.js" type="module"></script>
  </body>
</html>
